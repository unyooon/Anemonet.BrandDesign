name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run build:all

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/158133839000/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@anemonet-dev.iam.gserviceaccount.com
          token_format: access_token

      - run: npx firebase-tools deploy --only hosting --project anemonet-dev
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
